{% extends "report_base.html" %}
{% block tab %}
<form method="post" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <fieldset {{ 'disabled' if not report.editable }}>
    <h3>封面 Document Information</h3>
    <div class="form-grid">
      <label>Date<input value="{{ report.report_date.strftime('%Y.%m.%d') }}" disabled></label>
      <label>Document No.<input value="{{ report.doc_no }}" disabled></label>
      <label>Contractor Doc No.<input value="{{ report.contractor_doc_no }}" disabled></label>
      <label>Revision<input type="number" min="0" name="revision" value="{{ report.revision }}"></label>
      <label>Issue Purpose<input name="issue_purpose" value="{{ report.issue_purpose }}"></label>
      <label>Inspection Time（檢查表）<input name="inspection_time" value="{{ report.inspection_time }}"></label>
      <label>Author<input value="{{ report.author.name }}" disabled></label>
      <label>Approval（核准人）<input name="approver_name" value="{{ report.approver_name }}" placeholder="核准後自動填入審核者"></label>
    </div>
    <h3>Shift Record（值班）</h3>
    <div class="form-grid">
      <label>First Line Duty officer<input name="first_line_officer" value="{{ report.first_line_officer }}"></label>
      <label class="wide">Second Line Backup Support<input name="second_line_support" value="{{ report.second_line_support }}"
             placeholder="例：Akshay Sampath / Allen Tsai / Jhengyu Wu"></label>
    </div>
    <p class="hint">文件編號依日期自動產生；新增日報時會沿用前一份日報的值班人員與核准人。</p>
    <button type="submit">儲存</button>
  </fieldset>
</form>
{% endblock %}
